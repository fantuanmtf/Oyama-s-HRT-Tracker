name: Tools hrt-cold

on:
  push:
    branches:
      - "Recovery/Tools"
    paths:
      - "tools/hrt-cold/**"
      - "configure"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/native/**"
      - "tests/native/**"
      - "docs/native/**"
      - ".github/workflows/tools-hrt-cold.yml"
  pull_request:
    paths:
      - "tools/hrt-cold/**"
      - "configure"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/native/**"
      - "tests/native/**"
      - "docs/native/**"
      - ".github/workflows/tools-hrt-cold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: tools/hrt-cold
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/hrt-cold/go.mod
          cache: false

      - name: Show Go version
        run: go version

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -v ./...

      - name: go build
        run: go build ./...

  native:
    name: Native scaffold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash configure --build-dir=build-native --enable-sanitizers --enable-werror
          else
            bash configure --build-dir=build-native --enable-werror
          fi

      - name: Build
        run: cmake --build build-native --config Release

      - name: Test
        shell: bash
        run: |
          cd build-native
          ctest -C Release --output-on-failure
